[project]
name = "xiaozhi-music-mcp"
version = "0.1.0"
description = "Vietnamese Music MCP Server for Xiaozhi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
    "requests>=2.31.0"
]

[project.scripts]
xiaozhi-music-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "server.py"
]
